[project]
name = "factorio-mcp"
version = "0.1.0"
description = "Model Context Protocol server that bridges Factorio through RCON and a coordinating mod."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Factorio MCP" }]
dependencies = [
    "mcp[cli]>=0.1.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[project.scripts]
factorio-mcp = "factorio_mcp.server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
